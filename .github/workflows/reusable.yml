

name: Reusable workflow
on:
  workflow_call:
    inputs:
      who-to-great:
        description: "A who to great passed from the caller workflow"
        default: "World"
        required: true
        type: string
jobs:
  reusable-job:
    runs-on: ubuntu-latest
    steps:
      - name: Echoes input param
        run: echo Hello ${{ inputs.who-to-great }}
